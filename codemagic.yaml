workflows:
  mac-desktop-unsigned:
    name: Mac desktop (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 24
      vars:
        BUN_VERSION: 1.4.2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
      - name: Install dependencies
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - name: Build the unsigned macOS app
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run dist:mac
    artifacts:
      - dist/*.dmg
      - dist/*.zip

  android-apk:
    name: Android APK (local build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
      java: "17"
      vars:
        BUN_VERSION: 1.4.2
        EXPO_PUBLIC_APP_ENV: production
        NODE_OPTIONS: --max-old-space-size=3072
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feat/dani-account
          include: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
      - name: Install dependencies
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - name: Point the app config at the live Expo project
        working-directory: apps/mobile
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json","utf8"));a.expo.extra.eas.projectId="aae4c765-8e67-4d77-aa14-58fe4935e774";a.expo.slug="dani-dex";fs.writeFileSync("app.json",JSON.stringify(a,null,2)+"\n")'
      - name: Prebuild the native Android project
        working-directory: apps/mobile
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx expo prebuild --platform android --non-interactive --no-install
      - name: Assemble the release APK
        working-directory: apps/mobile/android
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - apps/mobile/android/app/build/outputs/apk/release/*.apk
