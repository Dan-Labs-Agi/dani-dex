name: Onboarding screenshots (Intel Mac)

# Installs the Intel test build from an earlier run artifact on an Intel Mac runner, opens it and saves a real
# screenshot of each onboarding screen as an artifact. Publishes nothing.
on:
  push:
    branches:
      - build/onboarding-shots
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the app from the Intel test zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -m
          gh run download 45732990664 -R "$GITHUB_REPOSITORY" -n mac-x64-45732990664 -D /tmp/art
          shasum -a 256 /tmp/art/*.zip
          ditto -x -k /tmp/art/dani-dex-0.76.1-x64.zip /tmp/inst
          ls /tmp/inst
          xattr -cr /tmp/inst/*.app || true
      - name: Walk the onboarding
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cp scripts/onboarding-walk.mjs /tmp/pw/ && (cd /tmp/pw && npm init -y >/dev/null && npm i playwright-core)
          APP=$(ls -d /tmp/inst/*.app | head -1)
          node /tmp/pw/onboarding-walk.mjs "$APP"
      - name: Save
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-shots
          path: shots/
          if-no-files-found: warn
          retention-days: 7
