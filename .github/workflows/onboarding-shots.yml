name: Onboarding screenshots (Intel Mac)

# Installs the Intel test build from an earlier run artifact on an Intel Mac runner, opens it and saves a real
# screenshot of each onboarding screen as an artifact. Publishes nothing.
on:
  push:
    branches:
      - build/onboarding-shots
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the app from the Intel test zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -m
          curl -fsSL -o /tmp/art.zip https://dl.dani.danlab.dev/desktop/dani-dex-0.76.2-x64.zip
          shasum -a 512 /tmp/art.zip | cut -c1-20
          ditto -x -k /tmp/art.zip /tmp/inst
          ls /tmp/inst
          xattr -cr /tmp/inst/*.app || true
      - name: Walk the onboarding
        run: |
          set -euo pipefail
          true
          APP=$(ls -d /tmp/inst/*.app | head -1)
          node scripts/onboarding-walk.mjs "$APP"
      - name: Save
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-shots
          path: shots/
          if-no-files-found: warn
          retention-days: 7
