name: Desktop release direct

# Builds the unsigned desktop installers on GitHub runners and puts them on the download host at
# https://dl.dani.danlab.dev/desktop/, so the landing page can offer them without access to this
# private repository. Unsigned: macOS asks to open via right-click, Windows shows SmartScreen once;
# the landing page explains both. Only built installers go to the bucket, never source.
# Secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
on:
  push:
    branches:
      - build/desktop-releases
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"
  R2_ACCOUNT_ID: a2f714474bf94011597fd5cd1a92b56b
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Lets the runtime installer read the pinned runtime release in this private repo.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  mac-build:
    name: Mac ${{ matrix.arch }} build
    # Each architecture builds on a runner of its own kind. One arm64 job that packs both mixes
    # arm64 native parts into the x64 app, which then has no working Computer Use driver.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            machine: arm64
          - arch: x64
            runner: macos-15-intel
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun

      - name: Build the app and package the dmg
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          bun run voice:prepare-runtime
          bun run prepare:remote-desktop-runtime
          bun run verify:remote-desktop-runtime
          bun run prepare:cua-driver
          bun run build
          bunx electron-builder --mac dmg zip --${{ matrix.arch }} --config.mac.identity=null --config.mac.notarize=false --publish never
          ls -la dist/*.dmg dist/*.zip dist/latest-mac.yml

      - name: Check the app has this architecture's parts
        run: |
          set -euo pipefail
          APP=$(ls -d dist/mac*/*.app | head -1)
          R="$APP/Contents/Resources"
          test -x "$R/cua-driver/darwin/${{ matrix.arch }}/cua-driver"
          test -d "$R/remote-desktop-runtime/darwin/${{ matrix.arch }}"
          OTHER=$([ "${{ matrix.arch }}" = x64 ] && echo arm64 || echo x64)
          test ! -e "$R/cua-driver/darwin/$OTHER"

      - name: Keep the files for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  mac:
    name: Mac publish
    needs: mac-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: desktop-release-mac
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get both builds
        uses: actions/download-artifact@v4
        with:
          path: mac-files

      - name: Publish to the download host and update feed
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages boto3
          VERSION=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          for ARCH in arm64 x64; do
            python3 scripts/publish-feed.py --platform "mac-$ARCH" \
              --file "mac-files/mac-$ARCH/dani-dex-$VERSION-$ARCH.dmg" --key "desktop/Dani-Dex-mac-$ARCH.dmg" --version "$VERSION"
          done
          python3 scripts/merge-mac-feeds.py mac-files/mac-arm64/latest-mac.yml mac-files/mac-x64/latest-mac.yml > latest-mac.yml
          cat latest-mac.yml
          grep -q -- '-arm64.zip' latest-mac.yml
          grep -q -- '-x64.zip' latest-mac.yml
          # The zips and blockmaps go first, the feed last, so the feed never names a missing file.
          python3 scripts/publish-updater-files.py mac-files/mac-arm64/*.zip mac-files/mac-x64/*.zip mac-files/mac-arm64/*.blockmap mac-files/mac-x64/*.blockmap mac-files/mac-arm64/*.dmg mac-files/mac-x64/*.dmg
          python3 scripts/publish-updater-files.py latest-mac.yml

      - name: Verify the public URL
        run: |
          set -euo pipefail
          for ARCH in arm64 x64; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://dl.dani.danlab.dev/desktop/Dani-Dex-mac-$ARCH.dmg")
            echo "https://dl.dani.danlab.dev/desktop/Dani-Dex-mac-$ARCH.dmg -> $code"
            test "$code" = 200
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://dl.dani.danlab.dev/desktop/latest-mac.yml")
          echo "https://dl.dani.danlab.dev/desktop/latest-mac.yml -> $code"
          test "$code" = 200

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: desktop-release-windows
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun

      - name: Build the app and package the installer
        shell: bash
        run: |
          set -euo pipefail
          # Put bsdtar (System32) ahead of Git's GNU tar: GNU tar reads "D:\..." as a remote host and fails.
          export PATH="/c/Windows/System32:$PATH"
          bun run voice:prepare-runtime
          bun scripts/prepare-remote-desktop-runtime.ts win32 x64
          bun run verify:remote-desktop-runtime --windows
          bun scripts/install-cua-driver.ts win32 x64
          bun run build
          bunx electron-builder --win nsis --x64 --publish never
          ls -la dist/*.exe

      - name: Publish to the download host and update feed
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          python -m pip install --quiet boto3
          python scripts/publish-feed.py --platform windows \
            --file "dist/dani-dex-$VERSION-x64.exe" --key "desktop/Dani-Dex-win-x64.exe" --version "$VERSION"
          # latest.yml points at the exe under its build name, so upload that name too.
          python scripts/publish-updater-files.py dist/latest.yml dist/*.exe dist/*.blockmap

      - name: Verify the public URL
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://dl.dani.danlab.dev/desktop/Dani-Dex-win-x64.exe")
          echo "https://dl.dani.danlab.dev/desktop/Dani-Dex-win-x64.exe -> $code"
          test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://dl.dani.danlab.dev/desktop/latest.yml")
          echo "https://dl.dani.danlab.dev/desktop/latest.yml -> $code"
          test "$code" = 200
