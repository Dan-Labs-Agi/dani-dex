name: Mac update proof live feed

# Takes the live Mac app as the old build, serves a newer build from a local feed, runs the update
# steps, and checks that the installed app became the newer version and opens. It publishes nothing.
on:
  push:
    branches:
      - build/live-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Old build updates to the new build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install the live app as the old build
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Applications" "$RUNNER_TEMP/feed"
          curl -fsSL -o "$RUNNER_TEMP/old.zip" https://dl.dani.danlab.dev/desktop/dani-dex-0.76.1-arm64.zip
          ditto -x -k "$RUNNER_TEMP/old.zip" "$HOME/Applications"
          APP="$HOME/Applications/dani-dex.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          echo "--- signature of the old build"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|Identifier|flags" || true
          codesign -d -r- "$APP" 2>&1 | tail -2 || true

      - name: Show the live feed
        run: curl -fsS https://dl.dani.danlab.dev/desktop/latest-mac.yml | head -12

      - name: Run the update
        run: |
          set -euo pipefail
          bun scripts/mac-direct-update-e2e.ts https://dl.dani.danlab.dev/desktop/ "$HOME/Applications/dani-dex.app" 0.76.1
          sleep 15

      - name: Check the installed app is the newer build and opens
        run: |
          set -uo pipefail
          APP="$HOME/Applications/dani-dex.app"
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "installed version: $V"
          ls -d "$HOME/Applications/"*
          sleep 10
          pgrep -fl "dani-dex" | head -3 | tee "$RUNNER_TEMP/proc.txt" || true
          screencapture -x "$RUNNER_TEMP/proof.png" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Contents/Info.plist"
          codesign -dv "$APP" 2>&1 | head -3
          test "$V" = "0.76.2"
          test -s "$RUNNER_TEMP/proc.txt"

      - name: Save the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-proof
          path: ${{ runner.temp }}/proof.png
          if-no-files-found: ignore
