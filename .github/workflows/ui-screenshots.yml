name: UI screenshots

# Builds the desktop app on a free Linux runner and captures real screenshots of the
# screens reachable without an account, for product review. Uploads them as an artifact.

on:
  push:
    branches:
      - build/desktop-releases
  workflow_dispatch:

jobs:
  shots:
    name: Capture the desktop screens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun

      - name: Build the app
        run: |
          set -euo pipefail
          bun run voice:prepare-runtime
          bun run prepare:remote-desktop-runtime
          bun run prepare:cua-driver
          bun run build

      - name: Capture the screens
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" bun scripts/capture-ui-screenshots.ts

      - name: Save the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots-${{ github.run_id }}
          path: shots/
          if-no-files-found: warn
          retention-days: 7
