name: Publish release to the download host

# Copies the desktop assets of a published GitHub Release to https://dl.dani.danlab.dev/desktop/ so
# the app's updater and the download links work without access to this private repository.
# Only built artifacts go to the bucket, never source. Secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.18.6
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Upload desktop assets to R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-to-r2
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: https://a2f714474bf94011597fd5cd1a92b56b.r2.cloudflarestorage.com
      R2_BUCKET: dani-dex-releases
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' --pattern '*.AppImage' \
            --pattern '*.deb' --pattern '*.blockmap' --pattern 'latest*.yml' --pattern 'SHA256SUMS*.txt'
          ls -la assets

      # Versioned files first, update manifests last: an updater never sees a manifest whose files
      # are not there yet.
      - name: Upload to the bucket
        run: |
          set -euo pipefail
          s3() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT"; }
          find assets -type f ! -name 'latest*.yml' -print0 | while IFS= read -r -d '' f; do
            s3 cp "$f" "s3://$R2_BUCKET/desktop/$(basename "$f")"
          done
          # Stable download links that always point at the newest version.
          for pair in "arm64.dmg:Dani-Dex-arm64.dmg" "x64.dmg:Dani-Dex-x64.dmg"; do
            suffix=${pair%%:*}; stable=${pair##*:}
            file=$(find assets -type f -name "*${suffix}" | head -n1 || true)
            if [ -n "$file" ]; then s3 cp "$file" "s3://$R2_BUCKET/desktop/$stable"; fi
          done
          find assets -type f -name 'latest*.yml' -print0 | while IFS= read -r -d '' f; do
            s3 cp "$f" "s3://$R2_BUCKET/desktop/$(basename "$f")" --cache-control 'no-cache'
          done

      - name: Verify the public URL
        run: |
          set -euo pipefail
          for m in latest-mac.yml latest.yml latest-linux.yml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://dl.dani.danlab.dev/desktop/$m")
            echo "$m -> $code"
          done
          curl -fsS https://dl.dani.danlab.dev/desktop/latest-mac.yml | head -n 5
