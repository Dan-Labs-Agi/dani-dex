name = "dani-account"
main = "src/index.ts"
compatibility_date = "2024-11-01"
routes = [{ pattern = "auth.dani.danlab.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "dani-account"
database_id = "cd92a21a-9d25-4fa4-a578-5da21fca870d"
migrations_dir = "migrations"

# Secrets (wrangler secret put): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, STATE_SECRET

[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
